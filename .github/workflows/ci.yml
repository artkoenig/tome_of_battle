name: CI (Lint & Tests)

# Läuft bei PRs gegen main und bei Pushes auf main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Dieser Job braucht keinen Browser (der E2E läuft im separaten `e2e`-Job),
      # daher npm ci ohne Chromium-Download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      # Knip laeuft dateiuebergreifend (ungenutzte Dateien/Exports/Typen/Deps),
      # was oxlint pro Datei prinzipiell nicht sieht. Vorerst warn-only
      # (continue-on-error): Befunde sind im Log sichtbar, blockieren die CI aber
      # nicht, solange die bestehenden Befunde noch nicht aufgeraeumt sind.
      - name: Knip (statische Analyse, warn-only)
        run: npm run knip
        continue-on-error: true

      # cast liegt nicht auf npm, ist aber blankes Node ohne jede Abhaengigkeit in
      # einem oeffentlichen Repository: ein flacher Klon genuegt, wo `npm ci` nicht
      # zustaendig ist. Der Klon bleibt bewusst unversioniert -- die Pruefung folgt
      # dem aktuellen Stand des Werkzeugs.
      - name: cast beziehen (flacher Klon, ADR 0041)
        run: |
          git clone --depth 1 https://github.com/artkoenig/ai-blacksmith.git "$RUNNER_TEMP/ai-blacksmith"
          echo "$RUNNER_TEMP/ai-blacksmith/plugins/cast/bin" >> "$GITHUB_PATH"

      # Die Strukturpruefung (`npm run cast`, ADR 0041). Seit die Regeln auf
      # `error` stehen, laesst ein Verstoss diesen Step und damit den Workflow
      # fehlschlagen: die Schichtgrenzen aus ADR 0037 sind erstmals in der CI
      # geprueft und nicht mehr nur lokal. Die harten Grenzen -- Evaluator-Fassade
      # und Reinraum -- spiegelt zusaetzlich `no-restricted-imports` in
      # `.oxlintrc.json`, das der Lint-Step oben ausfuehrt.
      - name: Strukturpruefung (cast)
        run: npm run cast

      - name: Typecheck (tsc --noEmit, checkJs)
        run: npm run typecheck

      - name: Unit-/Component-Tests
        run: npx vitest run

  # Der Puppeteer-E2E (e2e/ui.test.js) braucht einen echten Browser und
  # läuft nun auf `main`.
  e2e:
    name: E2E (Puppeteer, nur main)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium für Puppeteer installieren
        run: npx puppeteer browsers install chrome

      - name: E2E-Test
        run: node e2e/ui.test.js

      # Schlägt der E2E fehl, hält ui.test.js den UI-Zustand als e2e-failure.png fest.
      # Als Artefakt hochladen, damit der Fehler am tatsächlichen Bildschirm nachvollziehbar
      # ist, statt nur am Stacktrace.
      - name: Fehler-Screenshot hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-screenshot
          path: e2e-failure.png
          if-no-files-found: ignore
